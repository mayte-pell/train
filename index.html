<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>La Máquina</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
::-webkit-scrollbar{display:none;}
body{background:#0c0c10;color:#f0f0f0;font-family:system-ui,-apple-system,sans-serif;max-width:480px;margin:0 auto;min-height:100vh;}
input::placeholder{color:rgba(255,255,255,0.18);}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;}
button{font-family:inherit;cursor:pointer;}
.glow{position:fixed;top:0;left:50%;transform:translateX(-50%);width:480px;height:220px;pointer-events:none;z-index:0;transition:background 0.6s;}
.header{position:sticky;top:0;z-index:100;background:rgba(12,12,16,0.97);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid rgba(255,255,255,0.05);padding:16px 20px 12px;}
.header-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;}
.eyebrow{font-size:9px;letter-spacing:5px;color:rgba(255,255,255,0.18);text-transform:uppercase;margin-bottom:4px;}
.day-title{font-size:17px;font-weight:700;letter-spacing:-0.3px;line-height:1.2;}
.week-pill{display:flex;align-items:center;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:100px;padding:3px 4px;flex-shrink:0;gap:2px;}
.week-btn{width:26px;height:26px;border-radius:50%;border:none;background:transparent;color:rgba(255,255,255,0.18);font-size:15px;display:flex;align-items:center;justify-content:center;transition:all 0.15s;}
.week-btn.active{background:rgba(255,255,255,0.08);color:#fff;}
.week-label{text-align:center;min-width:56px;font-size:11px;font-weight:600;color:rgba(255,255,255,0.7);letter-spacing:0.5px;}
.day-tabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px;}
.day-tab{flex-shrink:0;padding:5px 13px;border-radius:100px;font-size:11px;font-weight:700;cursor:pointer;transition:all 0.2s;letter-spacing:0.3px;}
.progress-row{display:flex;align-items:center;gap:10px;}
.progress-bar{flex:1;height:1.5px;background:rgba(255,255,255,0.06);border-radius:100px;overflow:hidden;}
.progress-fill{height:100%;border-radius:100px;transition:width 0.5s cubic-bezier(0.4,0,0.2,1);}
.progress-label{font-size:10px;font-weight:700;letter-spacing:0.5px;}
.abmode{display:flex;gap:6px;padding:12px 20px 0;}
.abmode-btn{flex:1;padding:8px;border-radius:9px;font-size:11px;font-weight:700;letter-spacing:1px;border:1px solid rgba(255,255,255,0.08);background:transparent;color:rgba(255,255,255,0.3);transition:all 0.2s;}
.legend{display:flex;gap:14px;padding:12px 20px;flex-wrap:wrap;border-bottom:1px solid rgba(255,255,255,0.04);}
.legend-item{display:flex;align-items:center;gap:5px;font-size:10px;color:rgba(255,255,255,0.3);letter-spacing:0.3px;}
.legend-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.block-label{font-size:9px;letter-spacing:4px;color:rgba(255,255,255,0.22);text-transform:uppercase;margin:20px 4px 10px;display:flex;align-items:center;gap:8px;}
.block-label span.t{color:rgba(255,255,255,0.3);}
.block-note{font-size:11px;color:rgba(255,255,255,0.3);line-height:1.5;margin:0 4px 12px;padding:9px 12px;background:rgba(255,255,255,0.03);border-radius:9px;border:1px solid rgba(255,255,255,0.05);}
.exercises{padding:4px 16px 8px;}
.ex-list{display:flex;flex-direction:column;gap:6px;}
.ex-card{border-radius:14px;overflow:hidden;transition:background 0.2s, border-color 0.2s;}
.ex-row{display:flex;align-items:center;gap:12px;padding:10px 12px;cursor:pointer;}
.ex-thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;flex-shrink:0;background:#151519;border:1px solid rgba(255,255,255,0.06);}
.ex-thumb-ph{width:52px;height:52px;border-radius:10px;flex-shrink:0;background:rgba(255,255,255,0.04);display:flex;align-items:center;justify-content:center;font-size:20px;}
.ex-info{flex:1;min-width:0;}
.ex-name{font-size:14px;font-weight:600;color:#eee;letter-spacing:-0.2px;}
.ex-name.done{color:rgba(255,255,255,0.25);text-decoration:line-through;}
.ex-target{font-size:10px;color:rgba(255,255,255,0.25);margin-top:2px;letter-spacing:0.2px;}
.ex-tags{display:flex;gap:5px;margin-top:6px;align-items:center;flex-wrap:wrap;}
.ex-sets{font-size:10px;font-weight:700;padding:2px 8px;border-radius:100px;}
.equip-badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:100px;}
.ex-last{font-size:10px;font-weight:700;}
.check-btn{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s;font-size:12px;font-weight:900;border:1.5px solid;}
.ex-expanded{padding:0 14px 14px;}
.ex-desc{font-size:12.5px;line-height:1.7;color:rgba(255,255,255,0.45);margin:2px 0 12px;}
.stats-row{display:flex;background:rgba(255,255,255,0.03);border-radius:10px;overflow:hidden;margin-bottom:10px;border:1px solid rgba(255,255,255,0.05);}
.stat{flex:1;text-align:center;padding:10px 4px;}
.stat-val{font-size:17px;font-weight:800;}
.stat-lbl{font-size:8px;color:rgba(255,255,255,0.22);letter-spacing:1.5px;margin-top:2px;text-transform:uppercase;}
.weight-box{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:12px 14px;}
.weight-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;}
.weight-lbl{font-size:9px;letter-spacing:3px;color:rgba(255,255,255,0.25);text-transform:uppercase;}
.weight-last{font-size:11px;font-weight:700;}
.hist-row{display:flex;gap:6px;margin-bottom:11px;overflow-x:auto;padding-bottom:2px;}
.hist-cell{flex-shrink:0;text-align:center;}
.hist-inner{min-width:36px;height:34px;padding:0 6px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
.hist-date{font-size:7px;color:rgba(255,255,255,0.2);margin-top:3px;letter-spacing:0.3px;}
.set-inputs{display:flex;flex-direction:column;gap:7px;}
.set-line{display:flex;align-items:center;gap:8px;}
.set-num{font-size:11px;color:rgba(255,255,255,0.3);width:22px;font-weight:700;}
.set-in{width:74px;background:rgba(255,255,255,0.05);border-radius:8px;padding:9px 11px;color:#fff;font-size:14px;outline:none;border:1px solid rgba(255,255,255,0.07);transition:border-color 0.2s;}
.set-x{color:rgba(255,255,255,0.25);}
.set-check{margin-left:auto;width:34px;height:34px;border-radius:8px;border:1.5px solid rgba(255,255,255,0.1);background:transparent;font-size:13px;font-weight:900;color:transparent;transition:all 0.2s;}
.note-line{font-size:11px;line-height:1.5;margin-top:9px;color:rgba(255,255,255,0.35);}
.cardio-section{padding:8px 16px 70px;}
.cardio-card{border-radius:14px;padding:16px;}
.cardio-title{font-size:9px;letter-spacing:4px;color:rgba(255,255,255,0.25);text-transform:uppercase;margin-bottom:10px;}
.cardio-text{font-size:13px;line-height:1.75;color:rgba(255,255,255,0.55);}
.cardio-note{font-size:11px;color:rgba(255,255,255,0.28);margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.06);line-height:1.5;}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(12,12,16,0.97);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid rgba(255,255,255,0.06);display:flex;z-index:100;}
.tab{flex:1;padding:11px 0 20px;background:none;border:none;color:rgba(255,255,255,0.3);font-size:10px;font-weight:600;letter-spacing:0.5px;display:flex;flex-direction:column;align-items:center;gap:3px;}
.tab.on{color:#fff;}
.tab-ico{font-size:18px;}
.food-wrap{padding:20px 20px 90px;}
.food-h{font-size:22px;font-weight:800;letter-spacing:-0.5px;margin-bottom:6px;}
.food-sub{font-size:12.5px;color:rgba(255,255,255,0.4);line-height:1.6;margin-bottom:20px;}
.hand-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:22px;}
.hand-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:13px;}
.hand-emoji{font-size:20px;margin-bottom:6px;}
.hand-name{font-size:13px;font-weight:700;color:#eee;}
.hand-portion{font-size:11px;color:rgba(255,255,255,0.4);margin-top:2px;}
.meal-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:14px;margin-bottom:10px;}
.meal-top{display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.meal-name{font-size:15px;font-weight:700;}
.meal-macros{font-size:11px;color:rgba(255,255,255,0.35);margin-top:3px;}
.meal-opts{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.06);font-size:12px;line-height:1.9;color:rgba(255,255,255,0.5);}
.meal-opts b{color:#eee;font-weight:600;}
.prot-track{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:16px;margin-top:6px;}
.prot-dots{display:flex;gap:10px;margin-top:12px;}
.prot-dot{width:44px;height:44px;border-radius:50%;border:2px solid;background:transparent;font-size:18px;font-weight:900;transition:all 0.2s;}
.bw-row{display:flex;gap:8px;margin-top:14px;}
.bw-in{flex:1;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.07);border-radius:9px;padding:11px 13px;color:#fff;font-size:15px;outline:none;}
.bw-save{background:#f0f0f0;color:#0c0c10;border:none;border-radius:9px;padding:0 18px;font-weight:700;}
.prog-wrap{padding:20px 20px 90px;}
.prog-ex{margin-bottom:8px;padding:12px 0;border-top:1px solid rgba(255,255,255,0.06);display:flex;justify-content:space-between;align-items:center;}
.prog-nm{font-size:13.5px;flex:1;padding-right:12px;}
.prog-dt{color:rgba(255,255,255,0.3);font-size:11px;}
.prog-vl{font-size:13px;font-weight:700;}
.empty{font-size:13px;color:rgba(255,255,255,0.35);line-height:1.6;padding:20px 0;}
</style>
</head>

<div class="glow" id="glow"></div>
<div id="app"></div>
<div class="tabbar" id="tabbar"></div>

let done={},sets={},bw=[],protein={};

function save(){try{
  localStorage.setItem('lm_done',JSON.stringify(done));
  localStorage.setItem('lm_sets',JSON.stringify(sets));
  localStorage.setItem('lm_bw',JSON.stringify(bw));
  localStorage.setItem('lm_prot',JSON.stringify(protein));
  localStorage.setItem('lm_week',currentWeek);
  localStorage.setItem('lm_day',activeDay);
  localStorage.setItem('lm_ab',abMode);
}catch(e){}}
function load(){try{
  let x;
  if(x=localStorage.getItem('lm_done'))done=JSON.parse(x);
  if(x=localStorage.getItem('lm_sets'))sets=JSON.parse(x);
  if(x=localStorage.getItem('lm_bw'))bw=JSON.parse(x);
  if(x=localStorage.getItem('lm_prot'))protein=JSON.parse(x);
  if(x=localStorage.getItem('lm_week'))currentWeek=parseInt(x);
  if(x=localStorage.getItem('lm_day'))activeDay=parseInt(x);
  if(x=localStorage.getItem('lm_ab'))abMode=x;
}catch(e){}}

function todayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function shortDate(k){const p=k.split('-');return parseInt(p[2])+'/'+parseInt(p[1]);}

function resolveItem(it){
  if(it.rot&&abMode==="B"&&it.altName){
    return Object.assign({},it,{
      name:it.altName,desc:it.altDesc||it.desc,
      thumb:it.altThumb!==undefined?it.altThumb:it.thumb,
      equip:it.altEquip||it.equip,
    });
  }
  return it;
}
function allItems(day){let a=[];day.blocks.forEach(b=>b.items.forEach(i=>a.push(i)));return a;}

function history(exid){
  let out=[];
  Object.keys(sets).sort().forEach(dk=>{
    const s=sets[dk][exid];
    if(!s)return;
    const dn=s.filter(x=>x.done&&x.w);
    if(dn.length){out.push({date:dk,w:Math.max(...dn.map(x=>Number(x.w)))});}
  });
  return out;
}
function lastMark(exid){
  const tk=todayKey();
  const dates=Object.keys(sets).filter(d=>d!==tk).sort().reverse();
  for(const d of dates){
    const s=sets[d]&&sets[d][exid];
    if(!s)continue;
    const dn=s.filter(x=>x.done&&(x.w||x.r));
    if(dn.length){const b=dn.reduce((a,c)=>Number(c.w||0)>Number(a.w||0)?c:a);return {w:b.w,r:b.r};}
  }
  return null;
}

function ensureSets(day){
  const tk=todayKey();
  if(!sets[tk])sets[tk]={};
  if(!sets[tk].__day)sets[tk].__day=day.id;
  allItems(day).forEach(raw=>{
    const it=resolveItem(raw);
    if(!sets[tk][it.id])sets[tk][it.id]=Array.from({length:it.sets},()=>({w:"",r:"",done:false}));
    else if(sets[tk][it.id].length!==it.sets)sets[tk][it.id]=Array.from({length:it.sets},(_,i)=>sets[tk][it.id][i]||{w:"",r:"",done:false});
  });
}

function setVal(exid,i,f,v){const tk=todayKey();if(!sets[tk]||!sets[tk][exid])return;sets[tk][exid][i][f]=v;save();}
function toggleSet(it,i){const tk=todayKey();const s=sets[tk][it.id][i];s.done=!s.done;save();render();}
function toggleExpand(id){expanded=expanded===id?null:id;render();}

function dayProgress(day){
  const tk=todayKey();if(!sets[tk]||sets[tk].__day!==day.id)return{d:0,t:0};
  let d=0,t=0;
  allItems(day).forEach(raw=>{const it=resolveItem(raw);const s=sets[tk][it.id];if(s){t+=s.length;d+=s.filter(x=>x.done).length;}});
  return{d,t};
}

function render(){
  const el=document.getElementById('app');
  renderTabs();
  if(view==="entrenar")el.innerHTML=renderTrain();
  else if(view==="plato")el.innerHTML=renderFood();
  else el.innerHTML=renderProg();
  bindInputs();
}

function renderTabs(){
  const tabs=[["entrenar","Entrenar","▦"],["plato","Plato","◍"],["progreso","Progreso","◈"]];
  document.getElementById('tabbar').innerHTML=tabs.map(t=>
    '<button class="tab '+(view===t[0]?'on':'')+'" onclick="setView(\''+t[0]+'\')"><span class="tab-ico">'+t[2]+'</span>'+t[1]+'</button>'
  ).join('');
}
function setView(v){view=v;expanded=null;save();render();}

function renderTrain(){
  const day=DAYS[activeDay];const color=day.color;
  ensureSets(day);
  document.getElementById('glow').style.background='radial-gradient(ellipse at 50% 0%, '+color+'12 0%, transparent 65%)';
  const pr=dayProgress(day);
  const pct=pr.t?Math.round(pr.d/pr.t*100):0;

  let h='<div class="header"><div class="header-top"><div>'+
    '<div class="eyebrow">La Máquina · 5 días</div>'+
    '<div class="day-title">'+day.title+'</div></div>'+
    '<div class="week-pill"><button class="week-btn '+(currentWeek>1?'active':'')+'" onclick="chWeek(-1)">‹</button>'+
    '<div class="week-label">Semana '+currentWeek+'</div><button class="week-btn active" onclick="chWeek(1)">›</button></div></div>';
  h+='<div class="day-tabs">'+DAYS.map((d,i)=>
    '<button class="day-tab" onclick="chDay('+i+')" style="border:1px solid '+(i===activeDay?d.color:'rgba(255,255,255,0.07)')+';background:'+(i===activeDay?d.color+'15':'transparent')+';color:'+(i===activeDay?d.color:'rgba(255,255,255,0.28)')+'">'+d.label+'</button>'
  ).join('')+'</div>';
  h+='<div class="progress-row"><div class="progress-bar"><div class="progress-fill" style="width:'+pct+'%;background:'+color+'"></div></div>'+
    '<span class="progress-label" style="color:'+color+'">'+pr.d+'/'+pr.t+'</span></div></div>';

  const hasRot=allItems(day).some(i=>i.rot);
  if(hasRot){
    h+='<div class="abmode">'+['A','B'].map(m=>
      '<button class="abmode-btn" onclick="setAB(\''+m+'\')" style="'+(abMode===m?'border-color:'+color+';background:'+color+'15;color:'+color:'')+'">SEMANA '+m+'</button>'
    ).join('')+'</div>';
  }

  h+='<div class="legend">'+
    '<div class="legend-item"><div class="legend-dot" style="background:#60a5fa"></div>Máquina</div>'+
    '<div class="legend-item"><div class="legend-dot" style="background:#a78bfa"></div>Polea</div>'+
    '<div class="legend-item"><div class="legend-dot" style="background:#4ade80"></div>Peso corporal</div>'+
    '<div class="legend-item"><div class="legend-dot" style="background:#fbbf24"></div>Cardio</div></div>';

  h+='<div class="exercises">';
  day.blocks.forEach(b=>{
    h+='<div class="block-label">'+b.name+' <span class="t">· '+b.time+'</span></div>';
    if(b.note)h+='<div class="block-note">'+b.note+'</div>';
    h+='<div class="ex-list">';
    b.items.forEach(raw=>{h+=renderCard(resolveItem(raw),day,color);});
    h+='</div>';
  });
  h+='</div>';

  h+='<div class="cardio-section"><div class="cardio-card" style="background:'+color+'0e;border:1px solid '+color+'22">'+
    '<div class="cardio-title">Cardio</div>'+
    '<div class="cardio-text">'+day.cardio.text+'</div>'+
    (day.cardio.note?'<div class="cardio-note">'+day.cardio.note+'</div>':'')+
    '</div></div>';
  return h;
}

function renderCard(it,day,color){
  const tk=todayKey();
  const s=(sets[tk]&&sets[tk][it.id])||[];
  const dn=s.filter(x=>x.done).length;
  const complete=s.length>0&&dn===s.length;
  const eq=EQUIP[it.equip];
  const open=expanded===it.id;
  const last=lastMark(it.id);

  let thumb;
  if(it.thumb&&THUMBS[it.thumb])thumb='<img class="ex-thumb" src="'+THUMBS[it.thumb]+'" alt="'+it.name+'"/>';
  else thumb='<div class="ex-thumb-ph">'+(it.equip==="libre"?'◇':'○')+'</div>';

  let h='<div class="ex-card" style="background:'+(complete?color+'0d':'rgba(255,255,255,0.025)')+';border:1px solid '+(complete?color+'28':'rgba(255,255,255,0.05)')+'">';
  h+='<div class="ex-row" onclick="toggleExpand(\''+it.id+'\')">'+thumb+
    '<div class="ex-info"><div class="ex-name'+(complete?' done':'')+'">'+it.name+'</div>'+
    '<div class="ex-target">'+it.target+'</div>'+
    '<div class="ex-tags"><span class="ex-sets" style="color:'+color+';background:'+color+'15">'+it.sets+' × '+it.reps+'</span>'+
    '<span class="equip-badge" style="color:'+eq.color+';background:'+eq.bg+'">'+eq.label+'</span>'+
    (last&&last.w?'<span class="ex-last" style="color:'+color+'">últ. '+last.w+' kg</span>':'')+
    '</div></div>';
  h+='<button class="check-btn" style="border-color:'+(complete?color:'rgba(255,255,255,0.1)')+';background:'+(complete?color:'transparent')+';color:'+(complete?'#000':'transparent')+'" onclick="event.stopPropagation();quickComplete(\''+it.id+'\')">✓</button>';
  h+='</div>';

  if(open){
    h+='<div class="ex-expanded"><p class="ex-desc">'+it.desc+'</p>';
    h+='<div class="stats-row">'+
      '<div class="stat" style="border-right:1px solid rgba(255,255,255,0.04)"><div class="stat-val" style="color:'+color+'">'+it.sets+'</div><div class="stat-lbl">Series</div></div>'+
      '<div class="stat" style="border-right:1px solid rgba(255,255,255,0.04)"><div class="stat-val">'+it.reps+'</div><div class="stat-lbl">Reps</div></div>'+
      '<div class="stat"><div class="stat-val">'+(it.rest>0?it.rest+'s':'—')+'</div><div class="stat-lbl">Descanso</div></div></div>';

    if(it.peso){
      const hist=history(it.id);
      h+='<div class="weight-box"><div class="weight-header"><span class="weight-lbl">Peso por serie</span>'+
        (last?'<span class="weight-last" style="color:'+color+'">última vez '+last.w+' kg'+(last.r?' × '+last.r:'')+'</span>':'<span class="weight-last" style="color:rgba(255,255,255,0.25)">primera vez</span>')+'</div>';
      if(hist.length){
        h+='<div class="hist-row">'+hist.slice(-6).map(x=>
          '<div class="hist-cell"><div class="hist-inner" style="background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.07)">'+x.w+'</div><div class="hist-date">'+shortDate(x.date)+'</div></div>'
        ).join('')+'</div>';
      }
      h+='<div class="set-inputs">';
      s.forEach((st,i)=>{
        h+='<div class="set-line"><span class="set-num">S'+(i+1)+'</span>'+
          '<input class="set-in" type="number" inputmode="decimal" placeholder="'+(last&&last.w?last.w:'kg')+'" value="'+(st.w||'')+'" data-ex="'+it.id+'" data-i="'+i+'" data-f="w" style="'+(st.done?'border-color:'+color+'50':'')+'"/>'+
          '<span class="set-x">×</span>'+
          '<input class="set-in" style="width:64px" type="number" inputmode="numeric" placeholder="reps" value="'+(st.r||'')+'" data-ex="'+it.id+'" data-i="'+i+'" data-f="r"/>'+
          '<button class="set-check" style="'+(st.done?'background:'+color+';border-color:'+color+';color:#000':'')+'" onclick="toggleSet2(\''+it.id+'\','+i+')">✓</button></div>';
      });
      h+='</div>';
      if(last&&s.some(x=>x.done&&x.w)){
        const todayMax=Math.max(...s.filter(x=>x.done&&x.w).map(x=>Number(x.w)));
        if(todayMax>=Number(last.w))h+='<div class="note-line" style="color:#4ade80">Igualaste o superaste la última vez. Si te quedaron 2 en reserva, subí la próxima.</div>';
      }
      h+='</div>';
    }else{
      h+='<div class="set-inputs">';
      s.forEach((st,i)=>{
        h+='<div class="set-line"><span class="set-num">S'+(i+1)+'</span>'+
          '<input class="set-in" style="width:auto;flex:1" type="text" placeholder="hecho / segundos / notas" value="'+(st.r||'')+'" data-ex="'+it.id+'" data-i="'+i+'" data-f="r"/>'+
          '<button class="set-check" style="'+(st.done?'background:'+color+';border-color:'+color+';color:#000':'')+'" onclick="toggleSet2(\''+it.id+'\','+i+')">✓</button></div>';
      });
      h+='</div>';
    }
    h+='</div>';
  }
  return h;
}

function quickComplete(exid){
  const tk=todayKey();const s=sets[tk][exid];if(!s)return;
  const all=s.every(x=>x.done);
  s.forEach(x=>x.done=!all);
  save();render();
}
function toggleSet2(exid,i){const tk=todayKey();sets[tk][exid][i].done=!sets[tk][exid][i].done;save();render();}
function chDay(i){activeDay=i;expanded=null;save();render();}
function chWeek(d){currentWeek=Math.max(1,Math.min(12,currentWeek+d));save();render();}
function setAB(m){abMode=m;expanded=null;save();render();}

function bindInputs(){
  document.querySelectorAll('.set-in').forEach(inp=>{
    inp.addEventListener('input',e=>{
      setVal(e.target.dataset.ex,parseInt(e.target.dataset.i),e.target.dataset.f,e.target.value);
    });
    inp.addEventListener('click',e=>e.stopPropagation());
  });
}

function renderFood(){
  const tk=todayKey();
  const pc=protein[tk]||0;
  let h='<div class="food-wrap"><div class="food-h">Plato</div>'+
    '<div class="food-sub">Sin contar nada. Ventana desde el almuerzo, tres comidas. Lo único que seguís es la proteína.</div>';
  h+='<div class="hand-grid">'+
    '<div class="hand-card"><div class="hand-emoji">✋</div><div class="hand-name">Proteína</div><div class="hand-portion">1½ palma</div></div>'+
    '<div class="hand-card"><div class="hand-emoji">✊</div><div class="hand-name">Carbo</div><div class="hand-portion">1 puñado</div></div>'+
    '<div class="hand-card"><div class="hand-emoji">🤲</div><div class="hand-name">Verdura</div><div class="hand-portion">2 puños</div></div>'+
    '<div class="hand-card"><div class="hand-emoji">👍</div><div class="hand-name">Grasa</div><div class="hand-portion">1 pulgar</div></div></div>';
  MEALS.forEach(m=>{
    const open=expanded==='meal-'+m.id;
    h+='<div class="meal-card"><div class="meal-top" onclick="toggleExpand(\'meal-'+m.id+'\')">'+
      '<div><div class="meal-name">'+m.name+'</div><div class="meal-macros">'+m.macros+'</div></div>'+
      '<span style="color:rgba(255,255,255,0.3);font-size:18px">'+(open?'−':'+')+'</span></div>';
    if(open)h+='<div class="meal-opts">'+m.opts+'</div>';
    h+='</div>';
  });
  h+='<div class="prot-track"><div class="weight-lbl">Proteína de hoy · 3 tomas</div>'+
    '<div class="prot-dots">'+[0,1,2].map(i=>
      '<button class="prot-dot" style="border-color:'+(i<pc?'#4ade80':'rgba(255,255,255,0.15)')+';background:'+(i<pc?'#4ade80':'transparent')+';color:'+(i<pc?'#0c0c10':'rgba(255,255,255,0.15)')+'" onclick="setProtein('+(i+1)+')">✓</button>'
    ).join('')+'</div></div>';
  h+='</div>';
  return h;
}
function setProtein(n){const tk=todayKey();protein[tk]=(protein[tk]===n)?n-1:n;save();render();}

function renderProg(){
  let h='<div class="prog-wrap"><div class="food-h">Progreso</div>'+
    '<div class="food-sub">Lo que importa: las cargas subiendo. El peso corporal, una vez al mes alcanza.</div>';

  h+='<div class="weight-lbl" style="margin-bottom:6px">Peso corporal</div>';
  h+='<div class="bw-row"><input class="bw-in" id="bwin" type="number" inputmode="decimal" placeholder="kg de hoy"/>'+
    '<button class="bw-save" onclick="saveBW()">Guardar</button></div>';
  if(bw.length){
    const last=bw[bw.length-1],first=bw[0];
    h+='<div style="margin-top:12px;font-size:14px;font-weight:700">'+last.kg+' kg';
    if(bw.length>1){const d=(last.kg-first.kg).toFixed(1);h+='<span style="color:rgba(255,255,255,0.4);font-size:12px;font-weight:400"> ('+d+' kg desde el inicio)</span>';}
    h+='</div>';
  }

  h+='<div class="weight-lbl" style="margin:26px 0 4px">Cargas · mejor serie de cada sesión</div>';
  const allEx={};
  DAYS.forEach(d=>allItems(d).forEach(raw=>{
    [raw,resolveItem(Object.assign({},raw))].forEach(()=>{});
    if(raw.peso){allEx[raw.id]=raw.name;if(raw.altName)allEx[raw.id+'_b']=raw.altName;}
  }));
  let any=false;
  const seen={};
  Object.keys(sets).sort().forEach(dk=>{
    Object.keys(sets[dk]).forEach(exid=>{
      if(exid==='__day')return;
      const hist=history(exid);
      if(!hist.length)return;
      seen[exid]=hist;
    });
  });
  const nameOf=(id)=>{
    for(const d of DAYS)for(const raw of allItems(d)){
      if(raw.id===id)return raw.name;
      const alt=resolveItem(Object.assign({},raw,{rot:'x'}));
    }
    for(const d of DAYS)for(const raw of allItems(d)){
      if(raw.rot&&raw.altName){const r=Object.assign({},raw);if(raw.id===id)return raw.altName;}
    }
    return id;
  };
  const ids=Object.keys(seen);
  if(!ids.length)h+='<div class="empty">Todavía no registraste series con peso. Cuando termines tu primer día, acá vas a ver cómo suben las cargas.</div>';
  ids.forEach(id=>{
    any=true;
    const hist=seen[id];const l=hist[hist.length-1];const p=hist.length>1?hist[hist.length-2]:null;
    const diff=p?l.w-p.w:0;
    h+='<div class="prog-ex"><span class="prog-nm">'+nameOf(id)+'<span class="prog-dt"> · '+shortDate(l.date)+'</span></span>'+
      '<span class="prog-vl">'+l.w+' kg'+(p&&diff!==0?'<span style="color:'+(diff>0?'#f472b6':'rgba(255,255,255,0.3)')+'"> '+(diff>0?'▲'+diff:'▼'+Math.abs(diff))+'</span>':'')+'</span></div>';
  });
  h+='</div>';
  return h;
}
function saveBW(){
  const v=document.getElementById('bwin').value;
  const kg=parseFloat(String(v).replace(',','.'));
  if(!kg||kg<=0)return;
  const tk=todayKey();
  bw=bw.filter(x=>x.date!==tk);bw.push({date:tk,kg:kg});bw.sort((a,b)=>a.date.localeCompare(b.date));
  save();render();
}

load();render();
</script>
